name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=high
      - name: Basic secret-pattern scan
        shell: bash
        run: |
          ! rg --glob '!node_modules/**' --glob '!package-lock.json' --glob '!*.md' '(?i)(api[_-]?key|secret|password)\s*[:=]\s*["'"'][^"'"']{12,}' .
